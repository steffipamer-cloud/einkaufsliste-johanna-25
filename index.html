<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;

    background:linear-gradient(
        135deg,
        #FF61D2 0%,
        #ff77d9 50%,
        #ff9ce5 100%
    );

    color:#1A00B8;

    min-height:100vh;

    margin:0;
    padding:15px;
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    color:#1A00B8;
    font-size:2rem;

    text-shadow:
        0 2px 10px rgba(255,255,255,0.5);
}

.card{
    background:rgba(255,255,255,0.85);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);

    color:#1A00B8;

    border-radius:16px;
    padding:15px;

    margin-bottom:12px;

    border:1px solid rgba(255,255,255,0.4);

    box-shadow:
        0 8px 20px rgba(26,0,184,0.15),
        0 2px 6px rgba(0,0,0,0.08);
}

.user{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;

    padding:14px;

    border-radius:12px;

    border:2px solid #1A00B8;

    color:#1A00B8;

    background:rgba(255,255,255,0.9);

    font-size:16px;
}

input::placeholder{
    color:#1A00B8;
    opacity:0.6;
}

button{
    border:none;
    border-radius:12px;

    cursor:pointer;

    font-size:16px;
    font-weight:bold;

    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
}

.add-btn{
    background:#1A00B8;
    color:white;
    padding:14px 18px;
}

.change-btn{
    background:#1A00B8;
    color:white;
    padding:10px 15px;
}

.delete-btn{
    background:#ff3366;
    color:white;
    padding:12px 15px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.item-content{
    flex:1;
    cursor:pointer;
}

.checked{
    text-decoration:line-through;
    color:#666;
}

.meta{
    font-size:12px;
    color:#1A00B8;
    margin-top:4px;
}

</style>
