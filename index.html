<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>johanna25 Einkaufsliste</title>
 
manifest.json
 
<meta name="theme-color" content="#4CAF50">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:15px;
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
    box-shadow:0 2px 5px rgba(0,0,0,.08);
}

.user{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:14px;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:16px;
}

button{
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

.add-btn{
    background:#4CAF50;
    color:white;
    padding:14px 18px;
}

.delete-btn{
    background:#f44336;
    color:white;
    padding:12px 15px;
}

.change-btn{
    background:#2196F3;
    color:white;
    padding:10px 15px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.item-content{
    flex:1;
    cursor:pointer;
}

.checked{
    text-decoration:line-through;
    color:gray;
}

.meta{
    font-size:12px;
    color:#666;
    margin-top:4px;
}

</style>
</head>
<body>

<h1>🛒 Unsere Einkaufsliste</h1>

<div class="card user">
    <div>
        <strong>Du bist:</strong>
        <span id="username"></span>
    </div>

    <button class="change-btn" onclick="changeUser()">
        Wechseln
    </button>
</div>

<div class="card">

    <div class="input-area">

        <input
            id="itemInput"
            placeholder="Artikel hinzufügen..."
        >

        <button
            class="add-btn"
            onclick="addItem()">
            ➕
        </button>

    </div>

</div>

<div id="list"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    updateDoc,
    doc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

/* FIREBASE DATEN EINTRAGEN */

const firebaseConfig = {

  apiKey: "AIzaSyCvuRjWFyhh0k_wjbyZp3RDK5yC4dpbGdU",

  authDomain: "einkaufsliste-johanna25.firebaseapp.com",

  projectId: "einkaufsliste-johanna25",

  storageBucket: "einkaufsliste-johanna25.firebasestorage.app",

  messagingSenderId: "628461116369",

  appId: "1:628461116369:web:830aa4526d8cb24fd61ef0"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
}

let user = localStorage.getItem("shoppingUser");

if (!user) {

    const answer = prompt(
`Wer bist du?

1 = Niiiii
2 = Spompi`
    );

    user =
        answer === "2"
        ? "Spompi"
        : "Niiiii";

    localStorage.setItem(
        "shoppingUser",
        user
    );
}

document.getElementById("username")
.textContent = user;

window.changeUser = function(){

    const answer = prompt(
`Wer bist du?

1 = Niiiii
2 = Spompi`
    );

    user =
        answer === "2"
        ? "Spompi"
        : "Niiiii";

    localStorage.setItem(
        "shoppingUser",
        user
    );

    document.getElementById(
        "username"
    ).textContent = user;
};

const shoppingCollection =
collection(db,"shopping");

window.addItem = async function(){

    const input =
        document.getElementById(
            "itemInput"
        );

    const text =
        input.value.trim();

    if(!text){
        return;
    }

    await addDoc(
        shoppingCollection,
        {
            text: text,
            creator: user,
            checked: false,
            createdAt:
                serverTimestamp()
        }
    );

    input.value = "";
};

window.toggleItem =
async function(id,current){

    await updateDoc(
        doc(db,"shopping",id),
        {
            checked: !current
        }
    );
};

window.deleteItem =
async function(id){

    if(
        !confirm(
            "Artikel löschen?"
        )
    ){
        return;
    }

    await deleteDoc(
        doc(
            db,
            "shopping",
            id
        )
    );
};

const q = query(
    shoppingCollection,
    orderBy(
        "createdAt",
        "asc"
    )
);

onSnapshot(q,(snapshot)=>{

    const list =
        document.getElementById(
            "list"
        );

    list.innerHTML = "";

    snapshot.forEach((entry)=>{

        const item =
            entry.data();

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "card";

        div.innerHTML = `

<div class="item">

    <div
        class="item-content"
        onclick="toggleItem(
            '${entry.id}',
            ${item.checked}
        )">

        <div
        class="${
            item.checked
            ? "checked"
            : ""
        }">

        ${
            item.checked
            ? "✅"
            : "⬜"
        }

        ${item.text}

        </div>

        <div class="meta">
            eingetragen von
            ${item.creator}
        </div>

    </div>

    <button
        class="delete-btn"
        onclick="deleteItem(
            '${entry.id}'
        )">

        🗑️

    </button>

</div>

`;

        list.appendChild(div);

    });

});

document
.getElementById("itemInput")
.addEventListener(
    "keydown",
    (e)=>{

        if(
            e.key === "Enter"
        ){
            addItem();
        }

    }
);

</script>

</body>
</html>
