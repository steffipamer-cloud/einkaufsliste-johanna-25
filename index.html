<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>niii & spompis einkaufsliste</title>

    <link rel="manifest" href="manifest.json">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <meta name="theme-color" content="#1A00B8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <style>
        :root{
            --blue:#1A00B8;
            --pink:#FFD1EF;
            --card:#FFF5FC;
        }

        *{
            box-sizing:border-box;
            font-family:'Nunito', sans-serif;
        }

        body{
            margin:0;
            padding:20px;
            min-height:100vh;
            background:var(--blue);
            color:var(--pink);
        }

        .container{
            max-width:700px;
            margin:auto;
        }

        h1{
            font-size:2.6rem;
            font-weight:800;
            text-align:center;
            color:var(--pink);
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            font-size:1.2rem;
            font-weight:600;
            color:var(--pink);
            margin-bottom:20px;
        }

        .card{
            background:var(--card);
            border-radius:22px;
            padding:16px;
            margin-bottom:16px;
            box-shadow:0 10px 25px rgba(0,0,0,0.15);
            color:var(--blue);
        }

        .user{
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:12px;
        }

        .input-area{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            min-width:0;
            padding:14px;
            font-size:18px;
            border-radius:10px;
            border:2px solid var(--blue);
            color:var(--blue);
            background:white;
        }

        input::placeholder{
            color:#7d6fd1;
        }

        input:focus-visible{
            outline:3px solid var(--pink);
            outline-offset:2px;
        }

        button{
            border:none;
            border-radius:16px;
            cursor:pointer;
            font-size:16px;
            font-weight:700;
            transition:transform 0.2s;
        }

        button:hover{
            transform:scale(1.04);
        }

        button:focus-visible{
            outline:3px solid var(--blue);
            outline-offset:3px;
        }

        .add-btn{
            flex:0 0 65px;
            background:var(--blue);
            color:var(--pink);
            font-size:30px;
        }

        .change-btn{
            background:var(--blue);
            color:var(--pink);
            padding:10px 16px;
        }

        .delete-btn{
            flex-shrink:0;
            background:var(--pink);
            color:var(--blue);
            padding:12px 14px;
            font-size:18px;
        }

        .item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:10px;
        }

        .item-content{
            cursor:pointer;
            flex:1;
            min-width:0;
            padding:0;
            background:transparent;
            color:var(--blue);
            text-align:left;
            font-weight:400;
        }

        .item-content:hover{
            transform:none;
        }

        .item-text{
            display:block;
            font-size:22px;
            overflow-wrap:anywhere;
        }

        .checked{
            text-decoration:line-through;
            opacity:0.55;
        }

        .meta{
            display:block;
            font-size:13px;
            margin-top:4px;
        }

        @media(max-width:420px){
            body{
                padding:14px;
            }

            h1{
                font-size:2rem;
            }

            .card{
                padding:14px;
            }

            input{
                padding:12px;
                font-size:16px;
            }

            .add-btn{
                flex-basis:52px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1> Niii & Spompi's</h1>

        <div class="subtitle">
             Einkaufsliste 🌶️🥨 
        </div>

        <div class="card user">
            <div>
                <strong>Ich bin:</strong>
                <span id="username"></span>
            </div>

            <button
                type="button"
                class="change-btn"
                onclick="changeUser()">
                wechseln
            </button>
        </div>

        <div class="card">
            <div class="input-area">
                <input
                    id="itemInput"
                    type="text"
                    placeholder="Artikel hinzufügen..."
                    aria-label="Artikel hinzufügen"
                >

                <button
                    type="button"
                    class="add-btn"
                    onclick="addItem()"
                    aria-label="Artikel hinzufügen">
                    +
                </button>
            </div>
        </div>

        <div id="list"></div>

    </div>

    <script type="module">
        import { initializeApp }
        from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

        import {
            getFirestore,
            collection,
            addDoc,
            deleteDoc,
            updateDoc,
            doc,
            query,
            orderBy,
            onSnapshot,
            serverTimestamp
        }
        from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCvuRjWFyhh0k_wjbyZp3RDK5yC4dpbGdU",
            authDomain: "einkaufsliste-johanna25.firebaseapp.com",
            projectId: "einkaufsliste-johanna25",
            storageBucket: "einkaufsliste-johanna25.firebasestorage.app",
            messagingSenderId: "628461116369",
            appId: "1:628461116369:web:830aa4526d8cb24fd61ef0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js").catch((error) => {
                console.error("Service Worker konnte nicht geladen werden:", error);
            });
        }

        let user = localStorage.getItem("shoppingUser");

        function selectUser() {
            const answer = prompt(
`Wer bist du?

1 = Niii
2 = Spompi`
            );

            return answer === "2" ? "Spompi" : "Niii";
        }

        if (!user) {
            user = selectUser();
            localStorage.setItem("shoppingUser", user);
        }

        document.getElementById("username").textContent = user;

        window.changeUser = function() {
            user = selectUser();
            localStorage.setItem("shoppingUser", user);
            document.getElementById("username").textContent = user;
        };

        const shoppingCollection = collection(db, "shopping");

        let addingItem = false;

        window.addItem = async function() {
            const input = document.getElementById("itemInput");
            const text = input.value.trim();

            if (!text || addingItem) {
                return;
            }

            addingItem = true;

            try {
                await addDoc(shoppingCollection, {
                    text: text,
                    creator: user,
                    checked: false,
                    createdAt: serverTimestamp()
                });

                if (input.value.trim() === text) {
                    input.value = "";
                }
            } catch (error) {
                console.error(error);
                alert("Der Artikel konnte nicht gespeichert werden. Bitte versuche es noch einmal.");
            } finally {
                addingItem = false;
            }
        };

        window.toggleItem = async function(id, current) {
            try {
                await updateDoc(doc(db, "shopping", id), {
                    checked: !current
                });
            } catch (error) {
                console.error(error);
                alert("Der Artikel konnte nicht aktualisiert werden.");
            }
        };

        window.deleteItem = async function(id) {
            if (!confirm("Artikel löschen?")) {
                return;
            }

            try {
                await deleteDoc(doc(db, "shopping", id));
            } catch (error) {
                console.error(error);
                alert("Der Artikel konnte nicht gelöscht werden.");
            }
        };

        const q = query(
            shoppingCollection,
            orderBy("createdAt", "asc")
        );

        onSnapshot(q, (snapshot) => {
            const list = document.getElementById("list");
            list.replaceChildren();

            snapshot.forEach((entry) => {
                const item = entry.data();

                const card = document.createElement("div");
                card.className = "card";

                const row = document.createElement("div");
                row.className = "item";

                const content = document.createElement("button");
                content.type = "button";
                content.className = "item-content";
                content.setAttribute("aria-pressed", String(Boolean(item.checked)));
                content.addEventListener("click", () => {
                    window.toggleItem(entry.id, Boolean(item.checked));
                });

                const text = document.createElement("span");
                text.className = "item-text" + (item.checked ? " checked" : "");
                text.textContent = `${item.checked ? "✅" : "⬜"} ${item.text}`;

                const meta = document.createElement("span");
                meta.className = "meta";
                meta.textContent = `eingetragen von ${item.creator}`;

                const deleteButton = document.createElement("button");
                deleteButton.type = "button";
                deleteButton.className = "delete-btn";
                deleteButton.textContent = "🗑️";
                deleteButton.setAttribute("aria-label", `${item.text} löschen`);
                deleteButton.addEventListener("click", () => {
                    window.deleteItem(entry.id);
                });

                content.append(text, meta);
                row.append(content, deleteButton);
                card.append(row);
                list.append(card);
            });
        }, (error) => {
            console.error(error);
            document.getElementById("list").textContent =
                "Die Einkaufsliste konnte nicht geladen werden. Bitte lade die Seite erneut.";
        });

        document.getElementById("itemInput").addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                window.addItem();
            }
        });
    </script>
</body>
</html>
