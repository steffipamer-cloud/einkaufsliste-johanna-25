<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>💖 Niiiii & Spompi 💙</title>

<link rel="manifest" href="manifest.json">

<link href="https://fonts.googleapismily=Baloo+2:wght@400;500;600;700&display=swap

<meta name="theme-color" content="#FF61D2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>

*{
    box-sizing:border-box;
    font-family:'Baloo 2', cursive;
}

body{
    margin:0;
    padding:20px;

    min-height:100vh;

    background:linear-gradient(
        135deg,
        #FF61D2 0%,
        #ff8ae2 100%
    );

    color:#1A00B8;
}

.container{
    max-width:700px;
    margin:auto;
}

h1{
    font-size:2.6rem;
    text-align:center;
    color:#1A00B8;

    margin-bottom:5px;

    text-shadow:
        0 2px 10px rgba(255,255,255,0.4);
}

.subtitle{
    text-align:center;
    font-size:1.2rem;
    font-weight:600;

    margin-bottom:20px;
}

.card{
    background:rgba(255,255,255,0.88);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border-radius:22px;

    padding:16px;

    margin-bottom:16px;

    box-shadow:
        0 10px 25px rgba(26,0,184,0.12);

    color:#1A00B8;
}

.user{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.input-area{
    display:flex;
    gap:10px;
}

input{
    flex:1;

    padding:14px;

    font-size:18px;

    border-radius:16px;

    border:2px solid #1A00B8;

    color:#1A00B8;

    background:white;
}

input::placeholder{
    color:#7d6fd1;
}

button{
    border:none;

    border-radius:16px;

    cursor:pointer;

    font-size:16px;

    font-weight:700;

    transition:0.2s;
}

button:hover{
    transform:scale(1.04);
}

.add-btn{
    width:65px;

    background:#1A00B8;

    color:white;

    font-size:30px;
}

.change-btn{
    background:#1A00B8;
    color:white;

    padding:10px 16px;
}

.delete-btn{
    background:#ff4d5e;

    color:white;

    padding:12px 14px;

    font-size:18px;
}

.item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.item-content{
    cursor:pointer;
    flex:1;
}

.item-text{
    font-size:22px;
}

.checked{
    text-decoration:line-through;
    opacity:0.55;
}

.meta{
    font-size:13px;
    margin-top:4px;
}

</style>
</head>

<body>

<div class="container">

    <h1>💖 Niiiii & Spompi 💙</h1>

    <div class="subtitle">
        🛒 Unsere Einkaufsliste
    </div>

    <div class="card user">

        <div>
            <strong>Du bist:</strong>
            <span id="username"></span>
        </div>

        <button
            class="change-btn"
            onclick="changeUser()">
            Wechseln
        </button>

    </div>

    <div class="card">

        <div class="input-area">

            <input
                id="itemInput"
                placeholder="Artikel hinzufügen..."
            >

            <button
                class="add-btn"
                onclick="addItem()">
                +
            </button>

        </div>

    </div>

    <div id="list"></div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    deleteDoc,
    updateDoc,
    doc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyCvuRjWFyhh0k_wjbyZp3RDK5yC4dpbGdU",

  authDomain:
  "einkaufsliste-johanna25.firebaseapp.com",

  projectId:
  "einkaufsliste-johanna25",

  storageBucket:
  "einkaufsliste-johanna25.firebasestorage.app",

  messagingSenderId:
  "628461116369",

  appId:
  "1:628461116369:web:830aa4526d8cb24fd61ef0"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

if ("serviceWorker" in navigator) {

    window.addEventListener("load", () => {

        navigator.serviceWorker.register("./sw.js");

    });

}

let user = localStorage.getItem("shoppingUser");

if(!user){

    const answer = prompt(
`Wer bist du?

1 = Niiiii
2 = Spompi`
    );

    user =
    answer === "2"
    ? "Spompi"
    : "Niiiii";

    localStorage.setItem(
        "shoppingUser",
        user
    );
}

document.getElementById(
    "username"
).textContent = user;

window.changeUser = function(){

    const answer = prompt(
`Wer bist du?

1 = Niiiii
2 = Spompi`
    );

    user =
    answer === "2"
    ? "Spompi"
    : "Niiiii";

    localStorage.setItem(
        "shoppingUser",
        user
    );

    document.getElementById(
        "username"
    ).textContent = user;

};

const shoppingCollection =
collection(
    db,
    "shopping"
);

window.addItem = async function(){

    const input =
    document.getElementById(
        "itemInput"
    );

    const text =
    input.value.trim();

    if(!text){
        return;
    }

    await addDoc(
        shoppingCollection,
        {
            text:text,
            creator:user,
            checked:false,
            createdAt:
            serverTimestamp()
        }
    );

    input.value = "";
};

window.toggleItem =
async function(id,current){

    await updateDoc(
        doc(
            db,
            "shopping",
            id
        ),
        {
            checked:!current
        }
    );
};

window.deleteItem =
async function(id){

    if(
        !confirm(
            "Artikel löschen?"
        )
    ){
        return;
    }

    await deleteDoc(
        doc(
            db,
            "shopping",
            id
        )
    );
};

const q = query(
    shoppingCollection,
    orderBy(
        "createdAt",
        "asc"
    )
);

onSnapshot(
q,
(snapshot)=>{

    const list =
    document.getElementById(
        "list"
    );

    list.innerHTML = "";

    snapshot.forEach(
    (entry)=>{

        const item =
        entry.data();

        const div =
        document.createElement(
            "div"
        );

        div.className =
        "card";

        div.innerHTML = `

            <div class="item">

                <div
                    class="item-content"
                    onclick="toggleItem('${entry.id}', ${item.checked})">

                    <div class="item-text ${item.checked ? 'checked' : ''}">
                        ${item.checked ? '✅' : '⬜'} ${item.text}
                    </div>

                    <div class="meta">
                        eingetragen von ${item.creator}
                    </div>

                </div>

                <button
                    class="delete-btn"
                    onclick="deleteItem('${entry.id}')">
                    🗑️
                </button>

            </div>
        `;

        list.appendChild(div);

    });

});

document
.getElementById(
    "itemInput"
)
.addEventListener(
"keydown",
(e)=>{

    if(
        e.key === "Enter"
    ){
        addItem();
    }

});

</script>

</body>
</html>
